<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spice Route Menu - Dark Elegance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Inter:wght@400;500;600;700;800&family=Pacifico&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
      :root{
        --bg: #061014;         
        --paper: #121e24;      
        --ink: #f2eadc;        
        --ink-dim: #92a4a8;    
        --line: #b58d3d;       
        --accent-rich: #ff6b35;
        --accent-gold: #d4af37;
        --radius: 4px;
        --shadow-book: 0 50px 100px -20px rgba(0,0,0,0.9);
        --spine-gradient: linear-gradient(to right, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.2) 20%, rgba(0,0,0,0) 100%);
        --speed:.3s ease-out;
      }

      @media (prefers-reduced-motion: reduce){
        *{ animation:none !important; transition:none !important; }
      }

      html,body{
        margin:0; padding:0; height:100%;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Cormorant Garamond', serif; 
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow: hidden; 
      }

      @media (min-width: 1024px) {
        body { cursor: none; }
        a, button, .menu-item, .bookmark { cursor: none !important; }
      }

      #custom-cursor {
        position: fixed;
        top: 0; 
        left: 0;
        width: 40px;
        height: 40px;
        pointer-events: none;
        z-index: 99999;
        display: none;
        margin-top: -8px;
        margin-left: -20px;
      }

      @media (min-width: 1024px) {
        #custom-cursor { display: block; }
      }

      .subtitle-the {
          font-family: 'Inter', sans-serif;
          font-size: 0.85rem;
          color: var(--accent-gold);
          text-transform: uppercase;
          letter-spacing: 6px;
          margin: 0;
          font-weight: 600;
          text-align: center;
          opacity: 0; 
      }
      
      h1 {
        font-family: 'Playfair Display', serif; 
        font-size: 4.5rem; 
        color: var(--accent-rich);
        margin: 0;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-align: center;
        text-shadow: 0 4px 15px rgba(255, 107, 53, 0.2);
        opacity: 0; 
      }
      
      .menu-section-title {
          font-family: 'Playfair Display', serif;
          font-size: 2.4rem;
          color: var(--ink);
          margin-top: 60px;
          margin-bottom: 30px;
          padding-bottom: 15px;
          text-align: center;
          font-weight: 700;
          text-transform: uppercase;
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
      }
      
      .menu-section-title::after {
          content: '';
          display: block;
          width: 120px;
          height: 24px;
          background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 120 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M60 12 L45 2 L30 12 L45 22 Z' fill='%23d4af37' opacity='0.8'/%3E%3Cpath d='M0 12 H40 M80 12 H120' stroke='%23d4af37' stroke-width='1' opacity='0.5'/%3E%3Ccircle cx='60' cy='12' r='4' fill='%23ff6b35'/%3E%3C/svg%3E");
          background-repeat: no-repeat;
          background-position: center;
          margin-top: 15px;
      }

      .menu-item {
        background: transparent;
        border: none;
        padding: 12px 10px;
        cursor:none;
        display: block;
        position: relative;
        overflow: visible; 
        margin-bottom: 15px;
        border-radius: 8px;
        transition: background var(--speed);
      }
      
      .menu-item:hover {
          background: rgba(255, 107, 53, 0.05);
      }
      
      .menu-item:hover .dish-name {
          color: var(--accent-rich);
          transform: translateX(5px);
      }
      
      .menu-content-wrapper {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
          position: relative;
          z-index: 2;
          width: 100%;
      }
      
      .menu-content-wrapper::after {
          content: "";
          flex-grow: 1;
          order: 2;
          border-bottom: 1px dotted rgba(212, 175, 55, 0.4);
          margin: 0 10px;
          position: relative;
          top: -6px;
          transition: border-color 0.3s;
      }
      
      .menu-item:hover .menu-content-wrapper::after {
          border-bottom: 1px dotted var(--accent-rich);
      }

      .dish-name{
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin:0;
        order: 1;
        color: var(--ink);
        transition: all var(--speed);
      }
      
      .indicator {
        font-size: 1.2rem;
        color: var(--accent-gold);
        font-family: 'Cormorant Garamond', serif;
        font-weight: 600;
        order: 3;
      }

      .dish-tags{
        font-family: 'Inter', sans-serif;
        font-size: 0.7rem;
        color: var(--ink-dim);
        margin-top: 6px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-style: italic;
        text-align: left;
      }

      .bg-pattern {
          position: fixed;
          pointer-events: none;
          z-index: 1;
          opacity: 0.05;
      }
      .bg-mandala-1 {
          top: -20%; left: -10%; width: 60vw; height: 60vw;
      }
      .bg-mandala-2 {
          bottom: -20%; right: -10%; width: 50vw; height: 50vw;
      }
      
      @media (max-width: 1023px) {
          body {
              overflow-y: auto;
              background-image: radial-gradient(circle at 50% 0%, #112a33 0%, var(--bg) 80%);
          }
          
          .wrap {
            display:flex; flex-direction:column;
            min-height: 100vh;
            position: relative;
            z-index: 10;
          }

          main {
            background: var(--paper);
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            padding: 50px 25px 80px;
            max-width: 600px; 
            width: 92%;
            margin: 100px auto 50px;
            border-radius: var(--radius);
          }

          .menu-list {
            display:flex;
            flex-direction:column;
            gap: 5px; 
            margin-top: 15px; 
          }
          
          h1 { font-size: 3.2rem; }
          .menu-section-title { font-size: 1.8rem; margin-top: 35px; margin-bottom: 15px; }
          .dish-name { font-size: 1.3rem; }
          .main-title-wrapper { margin-bottom: 30px; }
          
          .desktop-only { display: none !important; }
          .bookmark, .corner-ornament, .spine-texture { display: none !important; }
      }

      @media (min-width: 1024px) {
          body {
              display: flex;
              align-items: center;
              justify-content: center;
              background-image: radial-gradient(circle at 50% 50%, #0d2229 0%, var(--bg) 100%);
          }
          
          #mainContent {
              position: relative;
              width: 100%;
              height: 100vh;
              padding-top: 5rem;
              display: flex;
              justify-content: center;
              align-items: center;
              z-index: 10;
          }

          .wrap {
              display: flex;
              flex-direction: row;
              width: 95%;
              max-width: 1400px; 
              height: 85vh; 
              background: var(--paper);
              box-shadow: var(--shadow-book);
              border-radius: 8px;
              position: relative;
              border: 1px solid rgba(212, 175, 55, 0.15);
          }
          
          .wrap::after {
              content: "";
              position: absolute;
              top: 0; bottom: 0; left: 80px;
              width: 50px;
              background: var(--spine-gradient);
              pointer-events: none;
              z-index: 20;
          }

          .bookmark {
            position: absolute;
            top: -10px; 
            left: 120px; 
            width: 50px;
            height: 160px;
            z-index: 100;
            transition: transform 0.2s;
          }

          .rope {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: var(--accent-gold);
            background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.2) 5px, rgba(0,0,0,0.2) 10px);
            border-radius: 2px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
          }

          .tassel {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 40px;
            background: var(--accent-rich);
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 80% 80%, 60% 100%, 40% 80%, 20% 100%, 0% 80%);
          }

          main {
              flex-grow: 1;
              background: transparent;
              padding: 60px 90px; 
              height: 100%;
              overflow-y: auto; 
              position: relative;
              outline: 1px solid rgba(212, 175, 55, 0.3);
              outline-offset: -30px;
              margin-left: 60px; 
              display: block;
              scrollbar-width: thin;
              scrollbar-color: var(--accent-gold) rgba(0,0,0,0.2);
          }
          
          main::-webkit-scrollbar { width: 6px; }
          main::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
          main::-webkit-scrollbar-thumb { background-color: var(--accent-gold); border-radius: 10px; }

          .corner-ornament {
              position: absolute;
              width: 80px;
              height: 80px;
              z-index: 5;
              pointer-events: none;
              opacity: 0.4;
          }
          .corner-ornament svg { width: 100%; height: 100%; fill: var(--accent-gold); }
          
          .co-tl { top: 35px; left: 95px; }
          .co-tr { top: 35px; right: 35px; transform: scaleX(-1); }
          .co-bl { bottom: 35px; left: 95px; transform: scaleY(-1); }
          .co-br { bottom: 35px; right: 35px; transform: scale(-1, -1); }

          .main-title-wrapper {
              text-align: center;
              margin-bottom: 60px;
              margin-top: 20px; 
          }
          
          .menu-list {
              column-count: 2; 
              column-gap: 6rem; 
              display: block; 
          }

          @media (min-width: 1600px) {
              .menu-list { column-count: 3; }
          }

          .menu-section-title {
              break-after: avoid; 
              column-span: all; 
              margin-top: 50px; 
          }
          
          .menu-item {
             break-inside: avoid;
             margin-bottom: 1.8rem;
          }
      }

      .modal-overlay {
        background-color: rgba(4, 9, 11, 0.9);
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        backdrop-filter: blur(8px);
      }

      .modal-content {
        background: var(--paper);
        border: 1px solid var(--accent-gold);
        padding: 50px 40px;
        max-width: 90%;
        width: 500px; 
        box-shadow: 0 25px 60px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.5);
        border-radius: 8px;
        text-align: center;
        position: relative;
      }
      
      .modal-title {
        font-family: 'Playfair Display', serif;
        font-size: 2.6rem;
        color: var(--accent-rich);
        text-align: center;
        margin-bottom: 1rem;
      }
      
      .modal-joke {
        font-family: 'Gochi Hand', cursive;
        font-size: 1.5rem;
        color: var(--ink);
        margin-bottom: 2rem;
        padding: 15px;
        background: rgba(212, 175, 55, 0.05); 
        border-radius: 8px;
        border-left: 3px solid var(--accent-gold);
      }
      
      .modal-specialty {
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.3rem;
        line-height: 1.5;
        color: var(--ink-dim);
        font-style: italic;
      }

      .modal-compliment {
        font-family: 'Gochi Hand', cursive;
        font-size: 1.3rem;
        color: var(--accent-gold);
        margin-top: 2rem;
        padding: 1rem;
        border-top: 1px dotted rgba(212, 175, 55, 0.3);
      }

      .modal-divider {
        border: 0;
        height: 1px;
        background-image: linear-gradient(to right, transparent, var(--accent-gold), transparent);
        margin: 2rem auto;
        width: 60%;
        opacity: 0.5;
      }
      
      .close-btn {
        position: absolute;
        top: 15px; right: 20px;
        background: transparent;
        border: none;
        color: var(--accent-gold);
        font-size: 2.5rem;
        cursor: pointer;
        opacity: 0.7;
        line-height: 1;
        transition: 0.3s;
      }
      .close-btn:hover { opacity: 1; transform: rotate(90deg) scale(1.1); color: var(--accent-rich); }
      
      @media (max-width: 768px) {
          .modal-content { padding: 30px 20px; }
          .modal-title { font-size: 2rem; }
          .modal-joke { font-size: 1.2rem; }
          .close-btn { top: 5px; right: 15px; }
      }
      
      header {
          background: rgba(6, 16, 20, 0.85) !important;
          backdrop-filter: blur(10px);
          border-bottom: 1px solid rgba(212, 175, 55, 0.1);
      }

      #noboborsho-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        opacity: 0;
        background-color: #000000; 
        backdrop-filter: blur(8px);
        transition: opacity 1s ease;
      }

      #wish-text {
        font-family: 'Playfair Display', serif;
        font-size: 6.5rem;
        color: var(--accent-gold);
        text-shadow: 0 0 30px rgba(212, 175, 55, 0.9);
        text-align: center;
        z-index: 1010;
        line-height: 1.1;
      }

      @media (max-width: 768px) {
          #wish-text { font-size: 3.5rem; }
      }

      #moon {
        position: fixed;
        top: 60px;
        right: 80px;
        width: 140px;
        height: 140px;
        background: #fefcd7;
        border-radius: 50%;
        box-shadow: 0 0 120px #fefcd7, 0 0 40px #fefcd7 inset;
        opacity: 0;
        z-index: 1005;
      }

      .lantern {
        position: fixed;
        top: 0;
        left: 0;
        width: 60px;
        height: 85px;
        pointer-events: none;
        z-index: 1005;
        will-change: transform, opacity;
      }

      .firework-shell {
        position: fixed;
        top: 0;
        left: 0;
        width: 4px;
        height: 15px;
        background-color: #ff6b35;
        border-radius: 2px;
        box-shadow: 0 0 12px #ff6b35;
        z-index: 1001;
        will-change: transform;
      }

      .firework-particle {
        position: fixed;
        top: 0;
        left: 0;
        border-radius: 50%;
        z-index: 1001;
        will-change: transform, opacity;
      }
    </style>
</head>

              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M0,0 L100,0 C100,0 80,20 80,40 C80,60 100,80 100,100 L0,100 Z" opacity="0.1"/><path d="M5,5 L40,5 C40,5 25,20 25,40 C25,60 40,75 40,75 L5,75 Z"/></svg>
          </div>
          <div class="corner-ornament co-bl hidden lg:block">
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M0,0 L100,0 C100,0 80,20 80,40 C80,60 100,80 100,100 L0,100 Z" opacity="0.1"/><path d="M5,5 L40,5 C40,5 25,20 25,40 C25,60 40,75 40,75 L5,75 Z"/></svg>
          </div>
          <div class="corner-ornament co-br hidden lg:block">
              <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M0,0 L100,0 C100,0 80,20 80,40 C80,60 100,80 100,100 L0,100 Z" opacity="0.1"/><path d="M5,5 L40,5 C40,5 25,20 25,40 C25,60 40,75 40,75 L5,75 Z"/></svg>

          <div class="main-title-wrapper"> 
              <p class="subtitle-the">THE INDIAN</p>
              <h1 class="hero-title">MENU</h1>

      const menuList = document.getElementById('menuList');
      const modal = document.getElementById('descriptionModal');
      const modalContent = document.querySelector('.modal-content');
      const cursor = document.getElementById('custom-cursor');
      const ribbon = document.getElementById('ribbonTrigger');
      
      document.addEventListener('mousemove', (e) => {
        gsap.to(cursor, {
          x: e.clientX,
          y: e.clientY,
          duration: 0, 
          ease: "none"
        });
      });

      function render() {
        menuList.innerHTML = "";
        MENU_STRUCTURE.forEach(section => {
            const sectionItems = DISHES.filter(d => 
                d.tags.some(tag => section.tags.includes(tag))
            );

            if (sectionItems.length > 0) {
                const titleElement = document.createElement('h2');
                titleElement.className = 'menu-section-title gsap-reveal';
                titleElement.textContent = section.title;
                menuList.appendChild(titleElement);

                sectionItems.forEach(d => {
                  const item = document.createElement('div');
                  item.className = 'menu-item gsap-item';
                  item.setAttribute('data-id', d.id);
                  item.onclick = () => openDescription(d.id);
                  
                  item.innerHTML = `
                    <div class="menu-content-wrapper">
                        <h2 class="dish-name">${d.name}</h2>
                        <div class="indicator">+</div>
                    </div>
                    <div class="dish-tags">
                        ${d.tags.map(t => `<span>${t}</span>`).join(' • ')}
                    </div>
                  `;
                  menuList.appendChild(item);
                });
            }
        });
        initGSAP();
      }

      function initGSAP() {
          gsap.to(".bg-mandala-1", { rotation: 360, duration: 80, repeat: -1, ease: "linear" });
          gsap.to(".bg-mandala-2", { rotation: -360, duration: 100, repeat: -1, ease: "linear" });
          gsap.from(".nav-item", { y: -30, opacity: 0, duration: 0.8, stagger: 0.1, ease: "power2.out", delay: 0.2 });
          gsap.to(".subtitle-the", { opacity: 1, y: -10, duration: 1, ease: "power2.out", delay: 0.5 });
          gsap.fromTo("h1", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 1.2, ease: "elastic.out(1, 0.5)", delay: 0.7 });
          gsap.from(".gsap-reveal", { opacity: 0, y: 20, duration: 0.8, stagger: 0.1, ease: "power2.out", delay: 1 });
          gsap.from(".gsap-item", { opacity: 0, x: -15, duration: 0.6, stagger: 0.02, ease: "power1.out", delay: 1.2 });
      }

      function openDescription(id) {
        const dish = DISHES.find(d => d.id === id);
        if (!dish) return;
        document.getElementById('modalTitle').textContent = dish.name;
        document.getElementById('modalJoke').textContent = `"${dish.joke}"`; 
        document.getElementById('modalSpecialty').innerHTML = `<span class="font-bold text-[var(--accent-rich)] text-sm uppercase tracking-wider block mb-2">The Specialty</span>${dish.line}`; 
        document.getElementById('modalCompliment').textContent = dish.compliment;
        modal.classList.add('open');
        modal.style.visibility = 'visible';
        gsap.to(modal, { opacity: 1, duration: 0.3 });
        gsap.fromTo(modalContent, { scale: 0.8, opacity: 0, y: 50 }, { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.5)" });
      }

      function closeDescription() {
        gsap.to(modalContent, { scale: 0.9, opacity: 0, y: 20, duration: 0.3, ease: "power2.in" });
        gsap.to(modal, { opacity: 0, duration: 0.3, delay: 0.1, onComplete: () => {
            modal.classList.remove('open');
            modal.style.visibility = 'hidden';
        }});
      }

      function createFirework() {
          const startX = Math.random() * window.innerWidth;
          const startY = window.innerHeight;
          const endY = window.innerHeight * 0.15 + Math.random() * 250; 

          const shell = document.createElement('div');
          shell.className = 'firework-shell';
          document.body.appendChild(shell);

          gsap.set(shell, { x: startX, y: startY });

          gsap.to(shell, {
            y: endY,
            duration: 1,
            ease: "power1.out",
            onComplete: () => {
              shell.remove();
              burst(startX, endY);
            }
          });
      }

      function burst(x, y) {
          const colors = ['#ff6b35', '#d4af37', '#f2eadc', '#ffea70'];
          for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'firework-particle';
            const size = Math.random() * 3 + 2;
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.backgroundColor = color;
            particle.style.boxShadow = `0 0 8px ${color}`;
            document.body.appendChild(particle);

            gsap.set(particle, { x: x, y: y });

            const angle = Math.random() * Math.PI * 2;
            const velocity = 50 + Math.random() * 100;
            
            gsap.to(particle, {
              x: x + Math.cos(angle) * velocity,
              y: y + Math.sin(angle) * velocity + 120, 
              opacity: 0,
              duration: 1 + Math.random(),
              ease: "power2.out",
              onComplete: () => particle.remove()
            });
          }
      }

      function celebrateNoboborsho() {
        if(ribbon.classList.contains('active')) return; 
        ribbon.classList.add('active');

        const tl = gsap.timeline();
        
        tl.to(ribbon, { y: 100, duration: 0.3, ease: "power2.inOut" })
          .to(ribbon, { y: 0, duration: 0.6, ease: "elastic.out(1, 0.3)" });

        gsap.to("#noboborsho-overlay", { opacity: 1, duration: 0.5 });
        gsap.to("#moon", { opacity: 1, duration: 2, ease: "power2.out", delay: 0.3 });
        gsap.fromTo("#wish-text", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.5, ease: "back.out(1.7)" });

        const celebrationDuration = 7000; 

        const lanternInterval = setInterval(() => {
          for(let i=0; i<4; i++) {
            const lantern = document.createElement('div');
            lantern.className = 'lantern';
            lantern.innerHTML = `
              <svg viewBox="0 0 60 85" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <radialGradient id="glow-opt" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffea70" stop-opacity="0.6"/>
                    <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
                  </radialGradient>
                </defs>
                <circle cx="30" cy="45" r="30" fill="url(#glow-opt)"/>
                <path d="M 25 15 C 25 5, 35 5, 35 15" fill="none" stroke="#d4af37" stroke-width="1.5"/>
                <ellipse cx="30" cy="18" rx="14" ry="3" fill="#8b5a2b"/>
                <path d="M 16 18 C 0 35 0 60 18 72 L 42 72 C 60 60 60 35 44 18 Z" fill="#ff6b35" opacity="0.8"/>
                <path d="M 30 18 L 30 72" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
                <ellipse cx="30" cy="72" rx="12" ry="3" fill="#8b5a2b"/>
                <circle cx="30" cy="58" r="4" fill="#ffea70"/>
                <path d="M 26 74 L 24 85 M 30 75 L 30 85 M 34 74 L 36 85" stroke="#d4af37" stroke-width="1" fill="none"/>
              </svg>
            `;
            document.body.appendChild(lantern);
            
            const startX = Math.random() * (window.innerWidth - 60);
            const sizeScale = 0.5 + Math.random() * 0.7;

            gsap.set(lantern, { x: startX, y: window.innerHeight + 100, scale: sizeScale, opacity: 0 });
            
            gsap.to(lantern, {
              y: -300,
              x: startX + (Math.random() - 0.5) * 200,
              rotation: (Math.random() - 0.5) * 40,
              opacity: 1,
              duration: 5 + Math.random() * 4,
              ease: "none",
              onComplete: () => lantern.remove()
            });
          }
        }, 200); 

        const fireworksInterval = setInterval(() => {
            createFirework();
        }, 500); 

        setTimeout(() => {
          clearInterval(lanternInterval);
          clearInterval(fireworksInterval);
          gsap.to(["#noboborsho-overlay", "#moon"], { opacity: 0, duration: 1.5, onComplete: () => {
              ribbon.classList.remove('active');
          }});
        }, celebrationDuration);
      }

      ribbon.addEventListener('click', celebrateNoboborsho);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('open')) closeDescription();
      });

      const mobileMenuBtn = document.getElementById('mobileMenuBtn');
      const mobileMenu = document.getElementById('mobileMenu');
      let menuOpen = false;

      mobileMenuBtn.addEventListener('click', () => {
          menuOpen = !menuOpen;
          if(menuOpen) {
              mobileMenu.classList.remove('hidden');
              mobileMenu.classList.add('flex');
              gsap.fromTo("#mobileMenu a", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.1 });
              mobileMenuBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-[var(--accent-rich)]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>`;
          } else {
              gsap.to("#mobileMenu a", { opacity: 0, y: -20, duration: 0.2, stagger: 0.05, onComplete: () => {
                  mobileMenu.classList.add('hidden');
                  mobileMenu.classList.remove('flex');
              }});
              mobileMenuBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-[var(--accent-gold)]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>`;
          }
      });

      render();
    </script>
</body>
</html>
